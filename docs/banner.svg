  <text x="204" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="#ffffff" letter-spacing="-1">gmgn-bot</text>
  <text x="206" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#c7cbff">Automated GM / GN scheduler for Discord</text>

