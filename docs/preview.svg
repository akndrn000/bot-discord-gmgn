<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="Pratinjau channel pemantau di Discord" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="470" rx="14" fill="#313338"/>
  <rect width="900" height="48" rx="14" fill="#2b2d31"/>
  <rect y="30" width="900" height="18" fill="#2b2d31"/>
  <line x1="0" y1="48" x2="900" y2="48" stroke="#1e1f22"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="22" y="31" font-size="20" fill="#80848e" font-weight="700">#</text>
    <text x="42" y="31" font-size="16" fill="#f2f3f5" font-weight="700">monitor-gmgn</text>

    <!-- message 1: user command -->
    <circle cx="44" cy="92" r="19" fill="#5865F2"/>
    <text x="44" y="98" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">U</text>
    <text x="78" y="86" font-size="15" fill="#f2f3f5" font-weight="700">kamu</text>
    <text x="78" y="108" font-size="15" fill="#dbdee1" font-family="Consolas, Menlo, monospace">!time gm:07.00, gn:19.00</text>

    <!-- message 2: reply -->
    <circle cx="44" cy="156" r="19" fill="#5865F2"/>
    <text x="44" y="162" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">U</text>
    <text x="78" y="150" font-size="15" fill="#f2f3f5" font-weight="700">kamu</text>
    <text x="78" y="172" font-size="15" fill="#dbdee1">Jadwal Diperbarui: GM <tspan fill="#c9cdfb" font-family="Consolas, Menlo, monospace">07:00</tspan>  |  GN <tspan fill="#c9cdfb" font-family="Consolas, Menlo, monospace">19:00</tspan></text>

    <!-- message 3: list -->
    <circle cx="44" cy="226" r="19" fill="#5865F2"/>
    <text x="44" y="232" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">U</text>
    <text x="78" y="220" font-size="15" fill="#f2f3f5" font-weight="700">kamu</text>
    <text x="78" y="242" font-size="15" fill="#dbdee1" font-family="Consolas, Menlo, monospace">!list</text>

    <!-- message 4: broadcast report card -->
    <circle cx="44" cy="296" r="19" fill="#5865F2"/>
    <text x="44" y="302" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">U</text>
    <text x="78" y="290" font-size="15" fill="#f2f3f5" font-weight="700">kamu</text>
    <rect x="78" y="302" width="4" height="146" rx="2" fill="#5865F2"/>
    <rect x="82" y="302" width="500" height="146" rx="4" fill="#2b2d31"/>
    <text x="100" y="328" font-size="15" fill="#f2f3f5" font-weight="700">LAPORAN BROADCAST: GM (Otomatis)</text>
    <text x="100" y="354" font-size="14" fill="#dbdee1">Status: Selesai (2/2 berhasil)</text>
    <text x="100" y="380" font-size="14" fill="#b5bac1" font-weight="700">Detail Pesan Terkirim:</text>
    <text x="100" y="402" font-size="14" fill="#dbdee1">• #general: <tspan font-family="Consolas, Menlo, monospace" fill="#c9cdfb">gm</tspan></text>
    <text x="100" y="424" font-size="14" fill="#dbdee1">• #chat: <tspan font-family="Consolas, Menlo, monospace" fill="#c9cdfb">gm frens</tspan></text>

    <!-- input bar -->
    <rect x="22" y="452" width="0" height="0"/>
  </g>
</svg>
